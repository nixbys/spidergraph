# Local pre-commit hooks. Install with:
#   pip install pre-commit && pre-commit install
repos:
  # Same version .github/workflows/secret-scan.yml pins for CI (keep these two in
  # sync) -- catches a secret before it's ever committed, not just before it's
  # merged. CI's own full-history scan stays the backstop for anything that slips
  # past a contributor who skipped this hook.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Local hooks that call this repo's own npm scripts (package.json) rather than a
  # separate pre-commit mirror for eslint/prettier -- so the rules a commit is
  # checked against are always exactly what .github/workflows/ci.yml runs (npm run
  # lint / npm run format:check), never a second, independently-versioned config
  # that can drift from eslint.config.mjs / .prettierrc.json.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm run lint --silent
        language: system
        pass_filenames: false
        files: \.(astro|js|mjs|cjs|ts)$

      - id: prettier-check
        name: prettier --check
        entry: npm run format:check --silent
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(package-lock\.json|public/spidergraph-demo\.gif)$
      - id: trailing-whitespace
        exclude: ^(package-lock\.json|public/spidergraph-demo\.gif)$
