<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spidergraph — Recommendations Report</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --bg:#0f1419; --surface:#171e27; --surface2:#1f2732; --surface3:#242e3a;
    --border:#2b3542; --border-soft:#20293380; --text:#e6ecf3; --muted:#8695a7; --muted2:#5e6b7c;
    --teal:#3ddc97; --amber:#e8a23d; --red:#e0596b; --blue:#5b8def;
    --teal-dim:#3ddc9722; --amber-dim:#e8a23d22; --red-dim:#e0596b22; --blue-dim:#5b8def22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, #16202c 0%, transparent 45%),
      radial-gradient(circle at 100% 20%, #141b24 0%, transparent 40%), var(--bg);
    color:var(--text); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; padding:32px 20px 100px;
  }
  .topnav{max-width:840px; margin:0 auto 28px; display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  .topnav a{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.04em; color:var(--muted);
    text-decoration:none; padding:8px 12px; border-radius:7px; border:1px solid transparent; transition:all .15s ease;}
  .topnav a:hover{color:var(--text); background:var(--surface2); border-color:var(--border);}
  .topnav a.current{color:var(--blue); background:var(--blue-dim); border-color:#5b8def55;}
  .topnav .sep{color:var(--border); margin:0 2px;}

  .doc-wrap{max-width:840px; margin:0 auto; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:48px clamp(20px,5vw,64px);}
  .eyebrow{font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--teal); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .eyebrow::before{content:"";width:6px;height:6px;background:var(--teal);border-radius:1px; display:inline-block;}

  #content h1{font-family:'Space Grotesk',sans-serif; font-size:clamp(26px,4vw,36px); font-weight:700;
    letter-spacing:-.01em; margin:0 0 8px;}
  #content h2{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin:44px 0 16px;
    padding-bottom:10px; border-bottom:1px solid var(--border); color:var(--text);}
  #content h3{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:28px 0 10px; color:var(--blue);}
  #content p{color:var(--text); line-height:1.7; font-size:14.5px; margin:0 0 14px;}
  #content strong{color:var(--text); font-weight:600;}
  #content ul,#content ol{color:var(--text); line-height:1.75; font-size:14.5px; padding-left:22px; margin:0 0 16px;}
  #content li{margin-bottom:6px;}
  #content li::marker{color:var(--muted2);}
  #content hr{border:none; border-top:1px solid var(--border); margin:36px 0;}
  #content code{font-family:'IBM Plex Mono',monospace; font-size:12.5px; background:var(--surface2);
    border:1px solid var(--border); padding:2px 6px; border-radius:5px; color:var(--teal);}
  #content a{color:var(--blue);}
  #content table{width:100%; border-collapse:collapse; margin:18px 0 22px; font-size:13px; display:block; overflow-x:auto;}
  #content th{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted2); text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;}
  #content td{padding:11px 14px; border-bottom:1px solid var(--border-soft); color:var(--text); vertical-align:top;}
  #content tr:hover td{background:var(--surface2);}

  .loading{color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px; text-align:center; padding:60px 0;}

  .brand{display:flex; align-items:center; gap:9px; text-decoration:none; margin-right:14px; padding-right:14px; border-right:1px solid var(--border);}
  .brand svg{display:block;}
  .brand-word{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:var(--text); letter-spacing:-0.2px;}
  .brand-word span{color:var(--teal);}
</style>
</head>

        <line x1="60" y1="60" x2="12" y2="60"/><line x1="60" y1="60" x2="26.06" y2="26.06"/>

</nav>
<div class="doc-wrap">
  <div class="eyebrow">Generated synthesis</div>
  <div id="content"><div class="loading">Loading report…</div></div>
</div>
<script>
  fetch('recommendations-report.md')
    .then(r => { if(!r.ok) throw new Error('fetch failed'); return r.text(); })
    .then(md => { document.getElementById('content').innerHTML = marked.parse(md); })
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<div class="loading">Could not load recommendations-report.md — this page needs to be served over HTTP (e.g. GitHub Pages or a local server), not opened directly as a file.</div>';
    });
</script>
</body>
</html>
