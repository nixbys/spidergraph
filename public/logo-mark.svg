<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spidergraph icon">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1a2432"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>

  <!-- grid rings -->
  <polygon points="60,28 82.63,37.37 92,60 82.63,82.63 60,92 37.37,82.63 28,60 37.37,37.37" fill="none" stroke="#2b3542" stroke-width="1.4"/>
  <polygon points="60,44 71.31,48.69 76,60 71.31,71.31 60,76 48.69,71.31 44,60 48.69,48.69" fill="none" stroke="#2b3542" stroke-width="1.4"/>

  <!-- spokes -->
  <g stroke="#2b3542" stroke-width="1.4">
    <line x1="60" y1="60" x2="60" y2="12"/>
    <line x1="60" y1="60" x2="93.94" y2="26.06"/>
    <line x1="60" y1="60" x2="108" y2="60"/>
    <line x1="60" y1="60" x2="93.94" y2="93.94"/>
    <line x1="60" y1="60" x2="60" y2="108"/>
    <line x1="60" y1="60" x2="26.06" y2="93.94"/>
    <line x1="60" y1="60" x2="12" y2="60"/>
    <line x1="60" y1="60" x2="26.06" y2="26.06"/>
  </g>

  <!-- outer boundary -->
  <polygon points="60,12 93.94,26.06 108,60 93.94,93.94 60,108 26.06,93.94 12,60 26.06,26.06" fill="none" stroke="#374252" stroke-width="1.6"/>

  <!-- coverage shape (the signature asymmetric data polygon) -->
  <polygon points="60,16 75.56,44.44 98,60 81.21,81.21 60,106 47.27,72.73 26,60 41.62,41.62"
           fill="#3ddc97" fill-opacity="0.28" stroke="#3ddc97" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- node points -->
  <g fill="#3ddc97">
    <circle cx="60" cy="16" r="3.4"/>
    <circle cx="75.56" cy="44.44" r="3.4"/>
    <circle cx="98" cy="60" r="3.4"/>
    <circle cx="81.21" cy="81.21" r="3.4"/>
    <circle cx="60" cy="106" r="3.4"/>
    <circle cx="47.27" cy="72.73" r="3.4"/>
    <circle cx="26" cy="60" r="3.4"/>
    <circle cx="41.62" cy="41.62" r="3.4"/>
  </g>

  <!-- center -->
  <circle cx="60" cy="60" r="2.6" fill="#e6ecf3"/>
</svg>
