# Weekly updates for npm packages and the SHA-pinned GitHub Actions. Version and
# security updates are each grouped, so a week's bumps arrive as one PR per
# ecosystem instead of one per package.

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # @astrojs/check (the typecheck step) supports TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
